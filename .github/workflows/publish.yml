name: Main CI and Publish

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish immutable image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and test
        run: |
          pip install --requirement requirements-dev.txt
          pytest

      - name: Set lowercase image name
        shell: bash
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_ENV}"

      - name: Build image for scanning
        run: docker build --build-arg "APP_VERSION=${GITHUB_SHA}" --tag "${IMAGE_NAME}:sha-${GITHUB_SHA}" .

      - name: Trivy security scan
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image \
            --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL \
            "${IMAGE_NAME}:sha-${GITHUB_SHA}"

      - name: Install Helm
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/helm.tar.gz \
            https://get.helm.sh/helm-v3.16.3-linux-amd64.tar.gz
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm

      - name: Validate Helm and Kubernetes resources
        run: |
          helm lint helm/cloud-native-api --strict
          helm template cloud-native helm/cloud-native-api --namespace cloud-native-demo > rendered.yaml

      - name: Install Kubeconform
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform

      - name: Run Kubeconform
        run: kubeconform -strict -summary -ignore-missing-schemas k8s rendered.yaml

      - name: Log in to GHCR
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Push immutable SHA image
        run: docker push "${IMAGE_NAME}:sha-${GITHUB_SHA}"

