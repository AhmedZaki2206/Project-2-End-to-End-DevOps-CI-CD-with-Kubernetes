name: Pull Request CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, build, scan, and validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install --requirement requirements-dev.txt

      - name: Run pytest
        run: pytest

      - name: Build Docker image
        run: docker build --build-arg "APP_VERSION=${GITHUB_SHA}" --tag "cloud-native-cicd-kubernetes:${GITHUB_SHA}" .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cloud-native-cicd-kubernetes:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Helm lint
        run: helm lint helm/cloud-native-api --strict

      - name: Helm template
        run: helm template cloud-native helm/cloud-native-api --namespace cloud-native-demo > rendered.yaml

      - name: Install Kubeconform
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform

      - name: Validate Kubernetes manifests
        run: kubeconform -strict -summary -ignore-missing-schemas k8s rendered.yaml

