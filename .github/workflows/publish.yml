name: Main CI and Publish

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish immutable image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and test
        run: |
          pip install --requirement requirements-dev.txt
          pytest

      - name: Set lowercase image name
        shell: bash
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_ENV}"

      - name: Build image for scanning
        run: docker build --build-arg "APP_VERSION=${GITHUB_SHA}" --tag "${IMAGE_NAME}:sha-${GITHUB_SHA}" .

      - name: Trivy security scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Validate Helm and Kubernetes resources
        run: |
          helm lint helm/cloud-native-api --strict
          helm template cloud-native helm/cloud-native-api --namespace cloud-native-demo > rendered.yaml

      - name: Run Kubeconform
        uses: docker://ghcr.io/yannh/kubeconform:v0.6.7
        with:
          entrypoint: /kubeconform
          args: -strict -summary -ignore-missing-schemas k8s rendered.yaml

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push immutable SHA image
        run: docker push "${IMAGE_NAME}:sha-${GITHUB_SHA}"

