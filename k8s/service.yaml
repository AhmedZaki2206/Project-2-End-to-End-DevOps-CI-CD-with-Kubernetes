apiVersion: v1
kind: Service
metadata:
  name: cloud-native-api
  namespace: cloud-native-demo
  labels:
    app.kubernetes.io/name: cloud-native-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cloud-native-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

