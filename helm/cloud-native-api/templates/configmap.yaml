apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloud-native-api.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "cloud-native-api.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  APP_READY: {{ .Values.config.appReady | quote }}

